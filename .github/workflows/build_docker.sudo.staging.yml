name: Build Docker Image (sudoroom branch)

on:
  workflow_dispatch:
  push:
    branches:
      - "staging"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sudoroom/membermatters

jobs:
  build-docker-sudoroom:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to packages container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          registry: ghcr.io
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}:staging,${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}:${{github.sha}}

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/MemberMatters-sudoroom/docker
            docker compose pull ${{ env.IMAGE_NAME }}:staging
            docker compose up -d mm-staging
            docker image prune -a -f
