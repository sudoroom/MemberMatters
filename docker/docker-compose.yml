services:
  mm-postgres:
    image: postgres:15.3-alpine
    restart: always
    environment:
      - POSTGRES_USER=membermatters
      - POSTGRES_PASSWORD=membermatters
      - POSTGRES_DB=membermatters
    ports:
      - "5432:5432"
    volumes:
      - mm-postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U membermatters"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MemberMatters Redis
  mm-redis:
    image: redis
    restart: always
    depends_on:
      - mm-postgres

  # MemberMatters
  mm-webapp:
    image: ghcr.io/sudoroom/membermatters:sudo
    build:
      dockerfile: docker/Dockerfile
      context: ..
    restart: always
    env_file: .env
    environment:
      MM_TIME_ZONE: America/Los_Angeles
      MM_ENV: "Production"
        # MM_SECRET_KEY: "replacedbyenvironmentvar"
      MM_USE_POSTGRES: True
      MM_REDIS_HOST: "redis://mm-redis:6379/0"
    ports:
      - "8000:8000"
    depends_on:
      - mm-postgres
      - mm-redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - /usr/app:/usr/app
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /usr/app/django.log:/usr/src/logs/django.log

  # MemberMatters Celery Worker
  mm-celery-worker:
    image: ghcr.io/sudoroom/membermatters:sudo
    restart: always
    environment:
      MM_ENV: "Production"
      MM_USE_POSTGRES: True
      MM_RUN_MODE: "celery_worker"
      MM_REDIS_HOST: "redis://mm-redis:6379/0"
    depends_on:
      - mm-webapp
      - mm-redis

  # MemberMatters Celery Beat
  mm-celery-beat:
    image: ghcr.io/sudoroom/membermatters:sudo
    restart: always
    environment:
      MM_ENV: "Production"
      MM_USE_POSTGRES: True
      MM_RUN_MODE: "celery_beat"
      MM_REDIS_HOST: "redis://mm-redis:6379/0"
    depends_on:
      - mm-webapp
      - mm-celery-worker
      - mm-redis

  mm-celery-prom-exporter:
    image: danihodovic/celery-exporter
    restart: always
    environment:
      CE_BROKER_URL: "redis://mm-redis:6379/0"
    depends_on:
      - mm-celery-worker
      - mm-redis

volumes:
  mm-postgres-volume:
    driver: local
